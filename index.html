<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sailfish OS RPM Repository Browser</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2333;--border:#30363d;
  --text:#c9d1d9;--text-muted:#8b949e;--primary:#58a6ff;--primary-dim:rgba(56,139,253,.15);
  --success:#3fb950;--warn:#d29922;--error:#f85149;--radius:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);color:var(--text);padding:6px 14px;transition:background .15s}
button:hover{background:var(--border)}
button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}button.primary:hover{opacity:.85}
button.danger{background:var(--error);color:#fff;border-color:var(--error)}button.danger:hover{opacity:.85}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
select{cursor:pointer}textarea{resize:vertical}

.container{max-width:1200px;margin:0 auto;padding:16px;box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:16px}
header h1{font-size:1.3rem;font-weight:600;display:flex;align-items:center;gap:10px}
header h1 .logo{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#a371f7);display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.header-actions{display:flex;gap:8px}

.main-content{width:100%}
.config-bar,.repos,.search-section{width:100%;max-width:100%;box-sizing:border-box}
.search-sticky-wrap{position:sticky;top:0;z-index:50;background:var(--surface);padding:14px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.config-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
.config-bar .field{display:flex;flex-direction:column;gap:4px}
.config-bar .field label{font-size:.8rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.config-bar .field select,.config-bar .field input{min-width:160px}
.search-bar select{min-width:100px}
.config-bar .field.adapt-field{flex:1;min-width:200px}
.config-bar .field.adapt-field input{width:100%}
.release-wrap{position:relative}
.release-dropdown{position:absolute;top:100%;left:0;right:0;margin-top:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);max-height:280px;overflow-y:auto;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
.release-dropdown.active{display:block}
.release-dropdown .release-opt{padding:8px 12px;cursor:pointer;font-size:.9rem;border-bottom:1px solid var(--border);transition:background .1s}
.release-dropdown .release-opt:last-child{border-bottom:none}
.release-dropdown .release-opt:hover{background:var(--surface2)}
.release-dropdown .release-opt .ver{font-weight:600;color:var(--primary)}
.release-dropdown .release-opt .meta{font-size:.78rem;color:var(--text-muted);margin-top:2px}

.adapt-wrap{position:relative}
.adapt-dropdown{position:absolute;top:100%;left:0;right:0;margin-top:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);max-height:280px;overflow-y:auto;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
.adapt-dropdown.active{display:block}
.adapt-dropdown .adapt-opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;cursor:pointer;font-size:.9rem;border-bottom:1px solid var(--border);transition:background .1s}
.adapt-dropdown .adapt-opt:last-child{border-bottom:none}
.adapt-dropdown .adapt-opt:hover{background:var(--surface2)}
.adapt-dropdown .adapt-opt .adapt-name{font-weight:500;color:var(--primary);flex:1}
.adapt-dropdown .adapt-opt .adapt-del{flex-shrink:0;padding:2px 8px;font-size:.75rem;color:var(--text-muted);opacity:.6;cursor:pointer;background:none;border:none}
.adapt-dropdown .adapt-opt .adapt-del:disabled{opacity:.3;cursor:default}
.adapt-dropdown .adapt-opt:hover .adapt-del:not(:disabled){opacity:1;color:var(--error)}

.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1100;opacity:0;pointer-events:none;transition:opacity .2s}
.confirm-overlay.active{opacity:1;pointer-events:auto}
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;min-width:280px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.confirm-box p{margin-bottom:16px}

section.repos{margin-bottom:16px}
section.repos h2{font-size:1rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.repo-grid{display:grid;gap:8px}
.repo-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:.9rem;transition:border-color .15s}
.repo-item:hover{border-color:var(--text-muted)}
.repo-item .repo-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'SF Mono',Consolas,'Liberation Mono',Menlo,monospace;font-size:.82rem}
.repo-item .status{font-size:.75rem;padding:2px 8px;border-radius:10px;white-space:nowrap}
.status.cached{background:rgba(63,185,80,.15);color:var(--success)}
.status.loading{background:rgba(210,153,34,.15);color:var(--warn)}
.status.error{background:rgba(248,81,73,.15);color:var(--error)}
.status.empty{background:rgba(139,148,158,.1);color:var(--text-muted)}
.repo-actions{display:flex;gap:6px}
.repo-actions button{padding:4px 10px;font-size:.8rem}
.bulk-actions{display:flex;gap:8px;margin-top:10px}

.search-section{padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;min-width:0}
.search-bar{display:flex;gap:10px;margin-bottom:0;min-width:0}
.search-bar input{flex:1;min-width:0;font-size:1rem;padding:10px 14px}
.search-bar button{font-size:1rem;padding:10px 20px}

.results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.results-header h2{font-size:1rem}
.results-header .count{color:var(--text-muted);font-size:.85rem}

.pkg-list{display:grid;gap:10px;min-width:0}
.pkg-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;transition:border-color .15s}
.pkg-card:hover{border-color:var(--text-muted)}
.pkg-card .pkg-title{font-weight:600;font-size:1rem;color:var(--primary);margin-bottom:2px}
.pkg-card .pkg-meta{font-size:.82rem;color:var(--text-muted);margin-bottom:6px;font-family:'SF Mono',Consolas,monospace}
.pkg-card .pkg-summary{font-size:.9rem;margin-bottom:8px}
.pkg-card .pkg-repo{font-size:.78rem;color:var(--text-muted);margin-bottom:8px;word-break:break-all}
.pkg-card .pkg-actions{display:flex;gap:8px;flex-wrap:wrap}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:90%;max-width:700px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:1.05rem}
.modal-header button{background:none;border:none;color:var(--text-muted);font-size:1.4rem;padding:0;line-height:1}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-body .form-group{margin-bottom:16px}
.modal-body .form-group label{display:block;font-size:.85rem;color:var(--text-muted);margin-bottom:4px}
.modal-body .form-group input,.modal-body .form-group textarea{width:100%}
.modal-body .form-group textarea{min-height:140px;font-family:'SF Mono',Consolas,monospace;font-size:.82rem;line-height:1.6}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap;flex-shrink:0}

.deps-list{list-style:none}
.deps-list li{padding:5px 0;border-bottom:1px solid var(--border);font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
.deps-list li:last-child{border:none}
.deps-list .dep-name{font-family:'SF Mono',Consolas,monospace;font-size:.85rem}
.deps-list .dep-right{display:flex;align-items:center;gap:8px}
.deps-list .dep-repo{font-size:.75rem;color:var(--text-muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deps-list .dep-dl-btn{padding:2px 8px;font-size:.75rem}
.deps-list .dep-dl-btn.downloaded{color:var(--success);opacity:.9}
.deps-list .dep-avail{font-size:.75rem;padding:1px 8px;border-radius:10px}
.dep-avail.found{background:rgba(63,185,80,.15);color:var(--success)}
.dep-avail.missing{background:rgba(248,81,73,.1);color:var(--error)}
.dep-name.clickable{cursor:pointer!important;color:var(--primary)}.dep-name.clickable:hover{text-decoration:underline}

.pkg-card{cursor:pointer}
.pkg-card-detail .info-row{display:flex;gap:12px;margin-bottom:10px;font-size:.9rem}
.pkg-card-detail .info-label{min-width:100px;color:var(--text-muted);flex-shrink:0}
.pkg-card-detail .info-value{word-break:break-word;font-family:'SF Mono',Consolas,monospace;font-size:.85rem}
.pkg-card-detail .section{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.pkg-card-detail .section-title{font-size:.85rem;color:var(--text-muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.pkg-card-detail .description{white-space:pre-wrap;font-size:.9rem;line-height:1.6}
.pkg-card-detail .provides-list,.pkg-card-detail .requires-list,.pkg-card-detail .files-list{font-family:'SF Mono',Consolas,monospace;font-size:.82rem}
.pkg-card-detail .provides-list span,.pkg-card-detail .requires-list span{display:inline-block;margin:2px 8px 2px 0;padding:2px 6px;background:var(--surface2);border-radius:4px}
.pkg-card-detail .files-list{max-height:200px;overflow-y:auto;padding:8px;background:var(--surface2);border-radius:var(--radius);white-space:pre-wrap;word-break:break-all;line-height:1.5}
.pkg-card-detail .files-unavail{font-size:.85rem;color:var(--text-muted);margin:0}

#toasts{position:fixed;top:16px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 18px;border-radius:var(--radius);font-size:.9rem;animation:slideIn .3s;min-width:260px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.toast-info{background:#1f6feb;color:#fff}.toast-success{background:#238636;color:#fff}
.toast-warn{background:#9e6a03;color:#fff}.toast-error{background:#da3633;color:#fff}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.empty-state{text-align:center;padding:48px 20px;color:var(--text-muted)}
.empty-state .icon{font-size:2.5rem;margin-bottom:12px}
.empty-state p{font-size:.95rem}

.cache-info{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--surface2);border-radius:var(--radius);font-size:.85rem;margin-top:8px}
.cache-info .cache-size{color:var(--primary);font-weight:600}

.template-list{width:100%;border-collapse:separate;border-spacing:0 8px}
.template-list td{padding:4px 8px 4px 0;vertical-align:middle}
.template-list td:nth-child(1){width:36px;min-width:36px;white-space:nowrap;padding-right:8px}
.template-list td:nth-child(2){width:auto}
.template-list td:nth-child(3){width:1%;white-space:nowrap}
.template-list .template-row input[type="text"]{width:100%;font-family:'SF Mono',Consolas,monospace;font-size:.82rem;box-sizing:border-box}
.template-list .template-row input[type="checkbox"]{cursor:pointer;width:18px;height:18px}
.template-list .template-row.template-disabled input[type="text"]{opacity:.6}
.template-list .template-row button{padding:4px 10px;font-size:.8rem}
.template-list th{text-align:left;font-size:.8rem;color:var(--text-muted);padding:4px 8px 4px 0;font-weight:500}
.template-list.proxy-list td:nth-child(1){width:auto}
.template-list.proxy-list td:nth-child(2){width:140px;min-width:140px}
.template-list.proxy-list td:nth-child(3){width:1%;white-space:nowrap}
.template-list.proxy-list select{width:100%;min-width:0}
.template-help{font-size:.8rem;color:var(--text-muted);margin-bottom:8px;padding:10px 12px;background:var(--surface2);border-radius:var(--radius);line-height:1.6}
.template-help summary{cursor:pointer;color:var(--primary)}
.template-help code{font-family:'SF Mono',Consolas,monospace;font-size:.78rem;background:var(--surface);padding:1px 4px;border-radius:4px}

.auth-banner{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.3);border-radius:var(--radius);margin-bottom:16px;font-size:.9rem;color:var(--warn)}

@media(max-width:700px){
  .config-bar{flex-direction:column;align-items:stretch}
  .config-bar .field{width:100%;min-width:0}
  .config-bar .field select,.config-bar .field input{min-width:0;width:100%;box-sizing:border-box}
}
</style>
<script src="translations-en.js"></script>
<script src="translations-ru.js"></script>
</head>
<body>
<div class="container">
  <header>
    <h1><span class="logo">R</span>Sailfish OS RPM Repository Browser</h1>
    <div class="header-actions">
      <button onclick="showSettings()" data-i18n="settings">Settings</button>
    </div>
  </header>

  <div id="authBanner" class="auth-banner" style="display:none" data-i18n="authBanner"></div>

  <div class="main-content">
  <div class="config-bar">
    <div class="field release-wrap">
      <label>Release</label>
      <input id="inpRelease" list="releaseList" data-i18n-placeholder="placeholderSelect" onfocus="showReleaseDropdown()" onclick="showReleaseDropdown()">
      <datalist id="releaseList"></datalist>
      <div id="releaseDropdown" class="release-dropdown"></div>
    </div>
    <div class="field">
      <label>Arch</label>
      <select id="selArch">
        <option value="armv7hl">armv7hl</option>
        <option value="aarch64" selected>aarch64</option>
        <option value="i486">i486</option>
      </select>
    </div>
    <div class="field adapt-field adapt-wrap">
      <label>Adaptation</label>
      <input id="inpAdaptation" data-i18n-placeholder="placeholderSelect" onfocus="showAdaptDropdown()" onclick="showAdaptDropdown()">
      <div id="adaptDropdown" class="adapt-dropdown"></div>
    </div>
  </div>

  <section class="repos">
    <h2><span data-i18n="repos"></span> <span id="repoCount" style="color:var(--text-muted);font-weight:400;font-size:.85rem"></span></h2>
    <div id="repoGrid" class="repo-grid"></div>
    <div class="bulk-actions">
      <button class="primary" onclick="refreshAllRepos()" data-i18n="refreshAll"></button>
      <button class="danger" onclick="confirmClearCache()" data-i18n="clearCache"></button>
      <button onclick="loadAllRepos()" data-i18n="loadAll"></button>
      <button onclick="refreshSystemDeps()" data-i18n="refreshSystem"></button>
      <button onclick="showSystemTree()" data-i18n="systemTree"></button>
      <span id="cacheStatus" style="font-size:.82rem;color:var(--text-muted);margin-left:8px"></span>
    </div>
  </div>

  <div class="search-sticky-wrap">
    <div class="search-bar">
      <input id="searchInput" type="text" data-i18n-placeholder="searchPlaceholder" onkeydown="if(event.key==='Enter')doSearch()">
      <select id="searchType">
        <option value="name">name</option>
        <option value="file">file</option>
        <option value="requires">requires</option>
        <option value="provides">provides</option>
      </select>
      <button class="primary" onclick="doSearch()" data-i18n="search"></button>
    </div>
  </div>
  <section class="search-section">
    <div class="results-header" id="resultsHeader" style="display:none">
      <h2 id="resultsHeading"></h2>
      <span class="count" id="resultsCount"></span>
    </div>
    <div id="resultsList" class="pkg-list"></div>
    <div id="emptyState" class="empty-state">
      <div class="icon">&#128230;</div>
      <p data-i18n="emptyState"></p>
    </div>
  </section>
  </div>
</div>

<div id="settingsOverlay" class="modal-overlay" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <div class="modal-header"><h3 data-i18n="settings"></h3><button onclick="closeSettings()">&times;</button></div>
    <div class="modal-body">
      <div class="form-group">
        <label>Release domain</label>
        <input id="cfgReleaseDomain" value="https://releases.jolla.com">
      </div>
      <div class="form-group">
        <label>Secure domain</label>
        <input id="cfgSecureDomain" value="https://store-repository.jolla.com">
      </div>
      <div class="form-group">
        <label data-i18n="loginLabel"></label>
        <input id="cfgUsername" autocomplete="username">
      </div>
      <div class="form-group">
        <label data-i18n="passwordLabel"></label>
        <input id="cfgPassword" type="password" autocomplete="current-password">
        <small style="display:block;margin-top:4px;color:var(--text-muted);font-size:.82rem" data-i18n="passwordHint"></small>
      </div>
      <div class="form-group">
        <label data-i18n="repoTemplates"></label>
        <details class="template-help" id="templateHelpDetails">
          <summary data-i18n="templateSubst"></summary>
          <div id="templateHelpContent" style="margin-top:8px"></div>
        </details>
        <table class="template-list"><tbody id="cfgRepoTemplatesList"></tbody></table>
        <button type="button" onclick="addRepoTemplateRow()" style="margin-top:8px" data-i18n="add"></button>
      </div>
      <div class="form-group">
        <label data-i18n="corsProxies"></label>
        <small style="display:block;margin-bottom:6px;color:var(--text-muted);font-size:.82rem" data-i18n="corsProxyHint"></small>
        <table class="template-list proxy-list"><thead><tr><th data-i18n="corsProxyUrl"></th><th data-i18n="corsProxyAuth"></th><th></th></tr></thead><tbody id="cfgCorsProxiesList"></tbody></table>
        <button type="button" onclick="addCorsProxyRow()" style="margin-top:8px" data-i18n="add"></button>
      </div>
      <div class="form-group">
        <label data-i18n="systemBaseDeps"></label>
        <small style="display:block;margin-bottom:6px;color:var(--text-muted);font-size:.82rem" data-i18n="systemBaseDepsHint"></small>
        <textarea id="cfgSystemBaseDeps" rows="4" placeholder="patterns-sailfish-device-configuration-$adaptation&#10;feature-jolla" style="font-family:'SF Mono',Consolas,monospace;font-size:.85rem"></textarea>
      </div>
      <div class="cache-info">
        <span data-i18n="cache"></span> <span id="cacheSize" class="cache-size">0 KB</span>
        <button onclick="confirmClearCache()" data-i18n="clearAllCache"></button>
      </div>
    </div>
    <div class="modal-footer">
      <button onclick="closeSettings()" data-i18n="cancel"></button>
      <button class="primary" onclick="saveSettings()" data-i18n="save"></button>
    </div>
  </div>
</div>

<div id="pkgCardOverlay" class="modal-overlay" onclick="if(event.target===this)closePkgCard()">
  <div class="modal" style="max-width:600px;min-width:320px">
    <div class="modal-header"><h3 id="pkgCardTitle" data-i18n="package"></h3><button onclick="closePkgCard()">&times;</button></div>
    <div class="modal-body" id="pkgCardBody"></div>
    <div class="modal-footer">
      <button id="pkgCardBack" onclick="pkgCardBack()" style="display:none" data-i18n="back"></button>
      <a id="pkgCardDownload" href="#" target="_blank"><button class="primary" data-i18n="download"></button></a>
      <button id="pkgCardDepsDownload" onclick="openDepsFromCard(false)" style="display:none" data-i18n="deps"></button>
      <button id="pkgCardDepsRepo" onclick="openDepsFromCard(true)" style="display:none" data-i18n="depsRepo"></button>
      <button id="pkgCardDepsSystem" onclick="openSystemDepsFromCard()" style="display:none" data-i18n="depsSystem"></button>
      <button onclick="showPkgXml()">XML</button>
      <button onclick="closePkgCard()" data-i18n="close"></button>
    </div>
  </div>
</div>

<div id="pkgXmlOverlay" class="modal-overlay" onclick="if(event.target===this)closePkgXml()">
  <div class="modal" style="max-width:800px">
    <div class="modal-header"><h3 id="pkgXmlTitle" data-i18n="xmlTitle"></h3><button onclick="closePkgXml()">&times;</button></div>
    <div class="modal-body"><pre id="pkgXmlContent" style="margin:0;font-size:.8rem;overflow:auto;max-height:70vh;white-space:pre-wrap;word-break:break-all"></pre></div>
    <div class="modal-footer">
      <button onclick="copyPkgXml()" data-i18n="copy"></button>
      <button onclick="closePkgXml()" data-i18n="close"></button>
    </div>
  </div>
</div>

<div id="depsOverlay" class="modal-overlay" onclick="if(event.target===this)closeDeps()">
  <div class="modal">
    <div class="modal-header"><h3 id="depsTitle" data-i18n="deps"></h3><button onclick="closeDeps()">&times;</button></div>
    <div class="modal-body">
      <div id="depsContent"></div>
    </div>
    <div class="modal-footer">

<script>
/* ===== i18n ===== */
const L = (navigator.language || navigator.userLanguage || '').toLowerCase().startsWith('ru') ? 'ru' : 'en';
const T = L === 'ru' ? (window.T_RU || {}) : (window.T_EN || {});
const T_FALLBACK = window.T_EN || {};
function t(key, params) {
  let s = T[key] || T_FALLBACK[key] || key;
  if (params) for (const k in params) s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]);
  return s;
}
function applyTranslations() {
  document.documentElement.lang = L;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  const h = document.getElementById('resultsHeading');
  if (h) h.textContent = t('results');
}

const KNOWN_ADAPTATIONS = [
  'adaptation-reeder-s19mps',
  'adaptation-qualcomm-sony-ganges',

  'adaptation-qualcomm-sony-lena',

  'adaptation-qualcomm-sony-keyaki',
  'adaptation-qualcomm-sony-loire',
  'adaptation-qualcomm-sony-nile',
];
const ADAPT_CACHE_KEY = 'rpm_adaptations';

const DEFAULT_CORS_PROXIES = [];

const DEFAULT_TEMPLATES = [
  '$releaseDomain/releases/$release/jolla-hw/adaptation-common/$arch/',
  '$secureDomain/releases/$release/jolla-hw/$adaptation/$arch/',
  '$secureDomain/features/$release/appsupport/$arch/',
  '$releaseDomain/jolla-apps/$release/$arch/',
  '$releaseDomain/features/$release/customers/jolla/$arch/',
  '$releaseDomain/releases/$release/hotfixes/$arch/',
  '$releaseDomain/releases/$release/jolla/$arch/',
  '$secureDomain/features/$release/sailfish-eas/$arch/',
  '$secureDomain/features/$release/xt9/$arch/',
];

const SYSTEM_DEP_PATTERNS = [
  /^rpmlib\(/,
  /^rtld\(/,
  /^config\(/,
  /^pkgconfig\(/,
  /^\//,
  /\.so/,
];

const DEFAULT_SYSTEM_BASE_DEPS = 'patterns-sailfish-device-configuration-$adaptation\nfeature-jolla';

const state = {
  releases: [],
  settings: loadSettingsFromStorage(),
  repos: [],
  allPackages: [],
  searchResults: [],
  currentDepsPkg: null,
  systemPreinstalled: new Set(),
  systemPreinstalledCount: 0,
};

function normalizeRepoTemplates(arr) {
  if (!Array.isArray(arr)) return DEFAULT_TEMPLATES.map(t => ({ template: t, enabled: true }));
  return arr.map(item =>
    typeof item === 'string' ? { template: item, enabled: true } : { template: item.template || '', enabled: item.enabled !== false }
  ).filter(x => x.template);
}

function normalizeCorsProxies(arr) {
  if (!Array.isArray(arr)) return DEFAULT_CORS_PROXIES.map(p => ({ ...p }));
  return arr.map(item => {
    const p = typeof item === 'string' ? { template: item, authType: 'header' } : item;
    const at = p.authType;
    const authType = at === 'query' || at === 'corsfix' || at === 'corsHeaders' ? at : 'header';
    return { template: p.template || '', authType };
  }).filter(x => x.template);
}

function loadSettingsFromStorage() {
  try {
    const s = JSON.parse(localStorage.getItem('rpm_settings'));
    if (s) {
      s.repoTemplates = normalizeRepoTemplates(s.repoTemplates);
      s.corsProxies = normalizeCorsProxies(s.corsProxies);
      if (s.systemBaseDeps == null) s.systemBaseDeps = DEFAULT_SYSTEM_BASE_DEPS;
      return s;
    }
  } catch {}
  return {
    releaseDomain: 'https://releases.jolla.com',
    secureDomain: 'https://store-repository.jolla.com',
    username: '',
    password: '',
    repoTemplates: DEFAULT_TEMPLATES.map(t => ({ template: t, enabled: true })),
    corsProxies: DEFAULT_CORS_PROXIES.map(p => ({ ...p })),
    systemBaseDeps: DEFAULT_SYSTEM_BASE_DEPS,
  };
}

function persistSettings() {
  localStorage.setItem('rpm_settings', JSON.stringify(state.settings));
}

/* ===== Toast ===== */
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

/* ===== Fetch с авто-выбором CORS прокси ===== */
let workingProxyIndex = -1;

function getCorsProxies() {
  return state.settings.corsProxies || [];
}

function isUrlInPath(template) {
  if (!template || !template.includes('$url')) return false;
  const qIdx = template.indexOf('?');
  return qIdx === -1 || template.indexOf('$url') < qIdx;
}

async function fetchViaProxy(targetUrl, proxy, extraHeaders = {}) {
  const useRawUrl = isUrlInPath(proxy.template);
  const urlPart = useRawUrl ? targetUrl : encodeURIComponent(targetUrl);
  const proxyUrl = (proxy.template || '').replace(/\$url/g, urlPart);
  const at = proxy.authType;
  let headers = {};
  if (at === 'corsfix' && Object.keys(extraHeaders).length) {
    headers['x-corsfix-headers'] = JSON.stringify(extraHeaders);
  } else if (at === 'corsHeaders' && Object.keys(extraHeaders).length) {
    headers['x-cors-headers'] = JSON.stringify(extraHeaders);
  } else if ((at === 'header') && Object.keys(extraHeaders).length) {
    headers = extraHeaders;
  }
  const resp = await fetch(proxyUrl, Object.keys(headers).length ? { headers } : {});
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp;
}

function is401Response(text) {
  if (!text || typeof text !== 'string') return false;
  const lower = text.toLowerCase();
  return (lower.includes('401') || lower.includes('authorization required')) && lower.includes('<html');
}

async function pFetch(url) {
  const s = state.settings;
  const authHeader = s.username && s.password && needsAuth(url)
    ? { 'Authorization': 'Basic ' + btoa(s.username + ':' + s.password) }
    : {};
  let targetUrl = url;
  if (s.username && s.password && needsAuth(url)) {
    try {
      const u = new URL(url);
      u.username = s.username;
      u.password = s.password;
      targetUrl = u.toString();
    } catch {}
  }

  const tryDirect = async () => {
    const resp = await fetch(url, { headers: authHeader });
    const text = await resp.text();
    if (resp.status === 401 || is401Response(text)) {
      document.getElementById('authBanner').style.display = '';
      throw new Error('AUTH_REQUIRED');
    }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return { ok: true, text: () => Promise.resolve(text) };
  };

  const tryProxies = async () => {
    const proxies = getCorsProxies();
    if (!proxies.length) throw new Error(t('corsFailed'));
    const start = workingProxyIndex >= 0 ? workingProxyIndex : 0;
    const maxPasses = 3;
    for (let pass = 0; pass < maxPasses; pass++) {
      for (let i = 0; i < proxies.length; i++) {
        const idx = (start + i) % proxies.length;
        const proxy = proxies[idx];
        const proxyTargetUrl = proxy.authType === 'query' ? targetUrl : url;
        const proxyHeaders = proxy.authType === 'query' ? {} : authHeader;
        try {
          const resp = await fetchViaProxy(proxyTargetUrl, proxy, proxyHeaders);
          const text = await resp.text();
          if (is401Response(text)) {
            document.getElementById('authBanner').style.display = '';
            if (!s.username || !s.password) {
              toast(t('authRequired'), 'warn');
            }
            throw new Error('AUTH_REQUIRED');
          }
          workingProxyIndex = idx;
          return { ok: true, text: () => Promise.resolve(text) };
        } catch (e) {
          if (e.message === 'AUTH_REQUIRED') throw e;
          workingProxyIndex = -1;
        }
      }
    }
    throw new Error(t('corsFailed'));
  };

  try {
    return await tryDirect();
  } catch (e) {
    if (e.message === 'AUTH_REQUIRED') throw e;
    return await tryProxies();
  }
}

async function pFetchGzip(url) {
  const s = state.settings;
  const authHeader = s.username && s.password && needsAuth(url)
    ? { 'Authorization': 'Basic ' + btoa(s.username + ':' + s.password) }
    : {};
  let targetUrl = url;
  if (s.username && s.password && needsAuth(url)) {
    try {
      const u = new URL(url);
      u.username = s.username;
      u.password = s.password;
      targetUrl = u.toString();
    } catch {}
  }

  const tryDirect = async () => {
    const resp = await fetch(url, { headers: authHeader });
    const ab = await resp.arrayBuffer();
    const text = new TextDecoder().decode(ab.slice(0, 512));
    if (resp.status === 401 || is401Response(text)) {
      document.getElementById('authBanner').style.display = '';
      throw new Error('AUTH_REQUIRED');
    }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const decompressed = await decompressGzip(ab);
    return { ok: true, text: () => Promise.resolve(decompressed) };
  };

  const tryProxies = async () => {
    const proxies = getCorsProxies();
    if (!proxies.length) throw new Error(t('corsFailed'));
    const start = workingProxyIndex >= 0 ? workingProxyIndex : 0;
    const maxPasses = 3;
    for (let pass = 0; pass < maxPasses; pass++) {
      for (let i = 0; i < proxies.length; i++) {
        const idx = (start + i) % proxies.length;
        const proxy = proxies[idx];
        const proxyTargetUrl = proxy.authType === 'query' ? targetUrl : url;
        const proxyHeaders = proxy.authType === 'query' ? {} : authHeader;
        try {
          const resp = await fetchViaProxy(proxyTargetUrl, proxy, proxyHeaders);
          const ab = await resp.arrayBuffer();
          const head = new TextDecoder().decode(ab.slice(0, 512));
          if (is401Response(head)) {
            document.getElementById('authBanner').style.display = '';
            if (!s.username || !s.password) {
              toast(t('authRequired'), 'warn');
            }
            throw new Error('AUTH_REQUIRED');
          }
          const decompressed = await decompressGzip(ab);
          workingProxyIndex = idx;
          return { ok: true, text: () => Promise.resolve(decompressed) };
        } catch (e) {
          if (e.message === 'AUTH_REQUIRED') throw e;
          workingProxyIndex = -1;
        }
      }
    }
    throw new Error(t('corsFailed'));
  };

  try {
    return await tryDirect();
  } catch (e) {
    if (e.message === 'AUTH_REQUIRED') throw e;
    return await tryProxies();
  }
}

async function decompressGzip(arrayBuffer) {
  const ds = new DecompressionStream('gzip');
  const blob = await new Response(new Blob([arrayBuffer]).stream().pipeThrough(ds)).blob();
  return new TextDecoder().decode(await blob.arrayBuffer());
}

function needsAuth(url) {
  const s = state.settings;
  return url.includes(s.secureDomain) || url.includes(s.releaseDomain);
}

/* ===== Releases ===== */
async function loadReleases() {
  const inp = document.getElementById('inpRelease');
  const list = document.getElementById('releaseList');
  try {
    const resp = await pFetch('https://coderus.openrepos.net/sailversion');
    const text = await resp.text();
    const re = /^(\d+\.\d+\.\d+\.\d+)\s*-\s*(.+?)\s*-\s*(\d{2}\s+\w+\s+\d{4})/gm;
    const releases = [];
    const seen = new Set();
    let m;
    while ((m = re.exec(text)) !== null) {
      const ver = m[1];
      if (!seen.has(ver)) { seen.add(ver); releases.push({ version: ver, name: m[2].trim(), date: m[3].trim() }); }
    }
    releases.sort((a, b) => b.version.localeCompare(a.version, undefined, { numeric: true }));
    state.releases = releases;
    list.innerHTML = releases.map(r =>
      `<option value="${r.version}">${r.version} — ${r.name} (${r.date})</option>`
    ).join('');
    const needLatest = !inp.value || inp.value.trim().toLowerCase() === 'latest';
    if (releases.length && needLatest) {
      inp.value = releases[0].version;
    }
    updateRepoList();
  } catch (e) {
    inp.placeholder = t('releaseManual');
    toast(t('loadReleasesFailed') + e.message, 'error');
  }
}

function showReleaseDropdown() {
  const dd = document.getElementById('releaseDropdown');
