  dd.innerHTML = state.releases.map(r =>
    `<div class="release-opt" data-ver="${esc(r.version)}">
      <span class="ver">${esc(r.version)}</span>
      <div class="meta">${esc(r.name)} · ${esc(r.date)}</div>
    </div>`
  ).join('');
  dd.classList.add('active');
  dd.querySelectorAll('.release-opt').forEach(el => {
    el.onclick = () => {
      document.getElementById('inpRelease').value = el.dataset.ver;
      hideReleaseDropdown();
      saveLastConfig();
      updateRepoList();
    };
  });
}

function hideReleaseDropdown() {
  document.getElementById('releaseDropdown').classList.remove('active');
}

document.addEventListener('click', e => {
  const wrap = document.querySelector('.release-wrap');
  if (wrap && !wrap.contains(e.target)) hideReleaseDropdown();
  const adaptWrap = document.querySelector('.adapt-wrap');
  if (adaptWrap && !adaptWrap.contains(e.target)) hideAdaptDropdown();
});

function getAdaptations() {
  const custom = [];
  try {
    const raw = localStorage.getItem(ADAPT_CACHE_KEY);
    if (raw) custom.push(...JSON.parse(raw));
  } catch {}
  const seen = new Set([...KNOWN_ADAPTATIONS, ...custom]);
  return [...KNOWN_ADAPTATIONS, ...custom.filter(c => !KNOWN_ADAPTATIONS.includes(c))];
}

function saveAdaptation(value) {
  const list = getAdaptations();
  if (list.includes(value)) return;
  const custom = list.filter(a => !KNOWN_ADAPTATIONS.includes(a));
  custom.push(value);
  localStorage.setItem(ADAPT_CACHE_KEY, JSON.stringify(custom));
}

function removeAdaptation(value) {
  const list = getAdaptations().filter(a => a !== value);
  const custom = list.filter(a => !KNOWN_ADAPTATIONS.includes(a));
  localStorage.setItem(ADAPT_CACHE_KEY, JSON.stringify(custom));
}

function showAdaptDropdown() {
  const dd = document.getElementById('adaptDropdown');
  const adaptations = getAdaptations();
  dd.innerHTML = adaptations.map(a => {
    const isKnown = KNOWN_ADAPTATIONS.includes(a);
    return `<div class="adapt-opt" data-val="${esc(a)}">
      <span class="adapt-name">${esc(a)}</span>
      <button type="button" class="adapt-del" ${isKnown ? `disabled title="${t('standardAdapt')}"` : ''} data-val="${esc(a)}">✕</button>
    </div>`;
  }).join('');
  dd.classList.add('active');
  dd.querySelectorAll('.adapt-opt').forEach(el => {
    el.onclick = (e) => {
      if (e.target.classList.contains('adapt-del')) {
        e.stopPropagation();
        if (!e.target.disabled) confirmRemoveAdapt(e.target.dataset.val);
      } else {
        document.getElementById('inpAdaptation').value = el.dataset.val;
        hideAdaptDropdown();
        saveLastConfig();
        updateRepoList();
      }
    };
  });
}

function hideAdaptDropdown() {
  document.getElementById('adaptDropdown').classList.remove('active');
}

let _confirmAction = null;

function confirmRemoveAdapt(val) {
  if (KNOWN_ADAPTATIONS.includes(val)) return;
  document.getElementById('confirmText').textContent = t('removeAdaptConfirm', { val });
  _confirmAction = () => {
    removeAdaptation(val);
    hideAdaptDropdown();
    showAdaptDropdown();
    updateRepoList();
    toast(t('adaptRemoved'), 'info');
  };
  document.getElementById('confirmOverlay').classList.add('active');
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('active');
  _confirmAction = null;
}

function runConfirmAction() {
  if (_confirmAction) _confirmAction();
  closeConfirm();
}

/* ===== Repo URL resolution ===== */
function resolveTemplate(tpl, archOverride) {
  const s = state.settings;
  const release = document.getElementById('inpRelease').value.trim();
  const arch = archOverride ?? document.getElementById('selArch').value;
  const adaptation = document.getElementById('inpAdaptation').value;
  let url = tpl
    .replace(/\$releaseDomain/g, s.releaseDomain)
    .replace(/\$secureDomain/g, s.secureDomain)
    .replace(/\$release/g, release)
    .replace(/\$arch/g, arch)
    .replace(/\$adaptation/g, adaptation);
  if (!url.endsWith('/')) url += '/';
  return url;
}

function resolveTemplateNoarch(tpl) {
  return resolveTemplate(tpl, 'noarch');
}

function templateNeedsAdaptation(tpl) {
  return tpl.includes('$adaptation');
}

function templateUsesSecureDomain(tpl) {
  return tpl.includes('$secureDomain');
}

function templateShortName(tpl) {
  let s = tpl
    .replace(/\$releaseDomain/g, '').replace(/\$secureDomain/g, '')
    .replace(/\/releases\//g, '/').replace(/\/features\//g, '/')
    .replace(/\$release/g, '').replace(/\$arch/g, '').replace(/\$adaptation/g, '{adapt}')
    .replace(/\/+/g, '/').replace(/^\/|\/$/g, '');
  if (s === 'jolla-hw/{adapt}') return 'adaptation';
  if (s === 'jolla-hw/adaptation-common') return 'adaptation-common';
  if (s === 'customers/jolla') return 'customers-jolla';
  return s;
}

function filterExcludedPackages(packages) {
  return packages.filter(p => {
    const arch = (p.arch || '').toLowerCase();
    const name = (p.name || '').toLowerCase();
    if (arch === 'src' || arch === 'nosrc') return false;
    if (name.endsWith('-debuginfo') || name.endsWith('-debugsource') || name.endsWith('-src')) return false;
    if (name.includes('-debug-')) return false;
    return true;
  });
}

/* ===== Repo list UI ===== */
async function updateRepoList() {
  const release = document.getElementById('inpRelease').value.trim();
  const arch = document.getElementById('selArch').value;
  const adaptation = document.getElementById('inpAdaptation').value;
  if (!release) return;

  const repos = [];
  for (const item of state.settings.repoTemplates) {
    if (!item.enabled) continue;
    const tpl = item.template;
    const needsAdapt = templateNeedsAdaptation(tpl);
    const needsSecureDomain = templateUsesSecureDomain(tpl);
    const disabled = needsAdapt && !adaptation;
    const url = disabled ? '' : resolveTemplate(tpl);
    const urlNoarch = disabled ? '' : resolveTemplateNoarch(tpl);
    const [cached, cachedNoarch] = url ? [await getCachedData(url), urlNoarch !== url ? await getCachedData(urlNoarch) : null] : [null, null];
    const packages = [];
    if (cached) packages.push(...filterExcludedPackages(cached.packages).map(p => ({ ...p, repoUrl: url })));
    if (cachedNoarch) packages.push(...filterExcludedPackages(cachedNoarch.packages).map(p => ({ ...p, repoUrl: urlNoarch })));
    repos.push({
      template: tpl,
      name: templateShortName(tpl),
      url,
      urlNoarch: urlNoarch !== url ? urlNoarch : '',
      disabled,
      needsSecureDomain,
      loading: false,
      error: null,
      packages,
      loaded: !!(cached || cachedNoarch),
      fromCache: !!(cached || cachedNoarch),
    });
  }
  state.repos = repos;

  mergeAllPackages();
  renderRepoList();
  await updateCacheStatusBar();
  if (state.allPackages.length) showAllPackages();
}

function renderRepoList() {
  const s = state.settings;
  const hasCredentials = !!(s.username && s.password);
  const hasCorsProxies = (getCorsProxies().length > 0);
  const grid = document.getElementById('repoGrid');
  grid.innerHTML = state.repos.map((r, i) => {
    let statusHtml = '';
    if (r.loading) statusHtml = `<span class="status loading"><span class="spinner"></span> ${t('loading')}</span>`;
    else if (r.error) statusHtml = `<span class="status error" title="${esc(r.error)}">${t('error')}</span>`;
    else if (r.loaded) statusHtml = `<span class="status cached">${r.packages.length} ${t('packages')}${r.fromCache ? ' ' + t('fromCache') : ''}</span>`;
    else if (r.disabled) statusHtml = `<span class="status empty">${t('needAdapt')}</span>`;
    else if (r.needsSecureDomain && !hasCredentials) statusHtml = `<span class="status empty">${t('noLogin')}</span>`;
    else if (!hasCorsProxies) statusHtml = `<span class="status empty">${t('noCors')}</span>`;
    else statusHtml = `<span class="status empty">${t('notLoaded')}</span>`;

    const needsSettingsBtn = (!r.loaded && (r.needsSecureDomain && !hasCredentials)) || (!r.loaded && !hasCorsProxies);
    const btnLabel = r.loaded ? t('update') : (needsSettingsBtn ? t('settings') : t('load'));
    const btnOnclick = needsSettingsBtn ? 'showSettings()' : `loadRepo(${i}, ${r.loaded})`;
    return `<div class="repo-item">
      <span class="repo-name" title="${esc(r.url || r.template)}">${esc(r.name)}</span>
      ${statusHtml}
      <div class="repo-actions">
        <button onclick="${btnOnclick}" ${r.disabled || r.loading ? 'disabled' : ''}>${btnLabel}</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('repoCount').textContent = `(${state.repos.filter(r => r.loaded).length}/${state.repos.length} ${t('loaded')})`;
}

/* ===== Load repo metadata ===== */
async function loadRepo(index, forceRefresh = false) {
  const repo = state.repos[index];
  if (repo.disabled || repo.loading) return;
  const cached = !forceRefresh && await getCachedData(repo.url);
  const cachedNoarch = repo.urlNoarch && !forceRefresh && await getCachedData(repo.urlNoarch);
  if (cached || cachedNoarch) {
    repo.packages = [];
    if (cached) repo.packages.push(...filterExcludedPackages(cached.packages).map(p => ({ ...p, repoUrl: repo.url })));
    if (cachedNoarch) repo.packages.push(...filterExcludedPackages(cachedNoarch.packages).map(p => ({ ...p, repoUrl: repo.urlNoarch })));
    repo.loaded = true;
    repo.fromCache = true;
    mergeAllPackages();
    renderRepoList();
    await updateCacheStatusBar();
    showAllPackages();
    toast(t('repoCached', { name: repo.name, count: repo.packages.length }), 'info');
    return;
  }
  repo.loading = true;
  repo.error = null;
  renderRepoList();

  const loadFromUrl = async (url) => {
    const repomdUrl = url + 'repodata/repomd.xml';
    const repomdResp = await pFetch(repomdUrl);
    const repomdText = await repomdResp.text();
    const { primary: primaryHref, filelists: filelistsHref } = parseRepomd(repomdText);
    if (!primaryHref) throw new Error('primary.xml not found in repomd.xml');
    const primaryUrl = url + primaryHref;
    const primaryResp = primaryUrl.endsWith('.gz') ? await pFetchGzip(primaryUrl) : await pFetch(primaryUrl);
    const primaryText = await primaryResp.text();
    let packages = filterExcludedPackages(parsePrimary(primaryText));
    if (filelistsHref) {
      try {
        const filelistsUrl = url + filelistsHref;
        const filelistsResp = filelistsUrl.endsWith('.gz') ? await pFetchGzip(filelistsUrl) : await pFetch(filelistsUrl);
        const filelistsText = await filelistsResp.text();
        const filelistMap = parseFilelists(filelistsText);
        mergeFilesIntoPackages(packages, filelistMap);
      } catch (_) { /* filelists optional */ }
    }
    return packages;
  };

  try {
    const [packagesArch, packagesNoarch] = await Promise.all([
      loadFromUrl(repo.url),
      repo.urlNoarch ? loadFromUrl(repo.urlNoarch).catch(() => []) : Promise.resolve([]),
    ]);
    repo.packages = [
      ...packagesArch.map(p => ({ ...p, repoUrl: repo.url })),
      ...packagesNoarch.map(p => ({ ...p, repoUrl: repo.urlNoarch })),
    ];
    repo.loaded = true;
    repo.fromCache = false;
    await setCachedData(repo.url, packagesArch);
    if (repo.urlNoarch && packagesNoarch.length) await setCachedData(repo.urlNoarch, packagesNoarch);
    mergeAllPackages();
    showAllPackages();
    toast(t('repoLoaded', { name: repo.name, count: repo.packages.length }), 'success');
  } catch (e) {
    repo.error = e.message === 'AUTH_REQUIRED' ? t('authRequiredShort') : e.message;
    if (e.message !== 'AUTH_REQUIRED') toast(`${repo.name}: ${repo.error}`, 'error');
  } finally {
    repo.loading = false;
    mergeAllPackages();
    renderRepoList();
    await updateCacheStatusBar();
  }
}

async function loadAllRepos() {
  if (!getCorsProxies().length) {
    toast(t('addCorsProxyHint'), 'warn');
    return;
  }
  const indices = state.repos.map((r, i) => (!r.disabled && !r.loading) ? i : -1).filter(i => i >= 0);
  for (const i of indices) {
    await loadRepo(i, false);
  }
  showAllPackages();
}

async function refreshAllRepos() {
  if (!getCorsProxies().length) {
    toast(t('addCorsProxyHint'), 'warn');
    return;
  }
  const s = state.settings;
  const hasCredentials = !!(s.username && s.password);
  const indices = state.repos.map((r, i) => {
    if (r.disabled || r.loading) return -1;
    if (r.needsSecureDomain && !hasCredentials) return -1;
    return i;
  }).filter(i => i >= 0);
  await clearAllCache();
  for (const i of indices) {
    await loadRepo(i, true);
  }
  showAllPackages();
  buildSystemPreinstalledSet();
}

function showAllPackages() {
  state.searchResults = [...state.allPackages];
  document.getElementById('searchInput').value = '';
  renderResults();
}

/* ===== XML Parsing ===== */
function parseRepomd(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const dataEls = doc.getElementsByTagNameNS('*', 'data');
  let primary = null, filelists = null;
  for (const d of dataEls) {
    const t = d.getAttribute('type');
    const loc = d.getElementsByTagNameNS('*', 'location')[0];
    const href = loc?.getAttribute('href') || '';
    if (t === 'primary') primary = href;
    else if (t === 'filelists') filelists = href;
  }
  return { primary, filelists };
}

function parseFilelists(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const pkgEls = doc.getElementsByTagNameNS('*', 'package');
  const map = new Map();
  for (const pkg of pkgEls) {
    const name = pkg.getAttribute('name') || '';
    const arch = pkg.getAttribute('arch') || '';
    const verEl = pkg.getElementsByTagNameNS('*', 'version')[0];
    const ver = verEl?.getAttribute('ver') || '';
    const rel = verEl?.getAttribute('rel') || '';
    const key = `${name}|${arch}|${ver}|${rel}`;
    const files = [];
    for (const f of pkg.getElementsByTagNameNS('*', 'file')) {
      const path = (f.getAttribute('name') || f.textContent || f.getElementsByTagNameNS('*', 'name')[0]?.textContent || '').trim();
      if (path) files.push(path);
    }
    if (files.length) map.set(key, files);
  }
  return map;
}

function mergeFilesIntoPackages(packages, filelistMap) {
  for (const p of packages) {
    const key = `${p.name}|${p.arch}|${p.ver}|${p.rel}`;
    p.files = filelistMap.get(key) || [];
  }
}

function parsePrimary(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const pkgEls = doc.getElementsByTagNameNS('*', 'package');
  const packages = [];
  for (const pkg of pkgEls) {
    if (pkg.getAttribute('type') !== 'rpm') continue;
    const getText = tag => { const el = pkg.getElementsByTagNameNS('*', tag)[0]; return el?.textContent || ''; };
    const getAttr = (tag, attr) => { const el = pkg.getElementsByTagNameNS('*', tag)[0]; return el?.getAttribute(attr) || ''; };

    const requires = [];
    const provides = [];

    const formatEls = pkg.getElementsByTagNameNS('*', 'format');
    if (formatEls.length) {
      const fmt = formatEls[0];
      const reqEl = fmt.getElementsByTagNameNS('http://linux.duke.edu/metadata/rpm', 'requires')[0];
      if (reqEl) {
        for (const e of reqEl.getElementsByTagNameNS('http://linux.duke.edu/metadata/rpm', 'entry')) {
          requires.push({
            name: e.getAttribute('name') || '',
            flags: e.getAttribute('flags') || '',
            ver: e.getAttribute('ver') || '',
          });
        }
      }
      const provEl = fmt.getElementsByTagNameNS('http://linux.duke.edu/metadata/rpm', 'provides')[0];
      if (provEl) {
        for (const e of provEl.getElementsByTagNameNS('http://linux.duke.edu/metadata/rpm', 'entry')) {
          provides.push(e.getAttribute('name') || '');
        }
      }
    }

    const xml = new XMLSerializer().serializeToString(pkg);
    packages.push({
      name: getText('name'),
      arch: getText('arch'),
      ver: getAttr('version', 'ver'),
      rel: getAttr('version', 'rel'),
      epoch: getAttr('version', 'epoch') || '0',
      summary: getText('summary'),
      description: getText('description'),
      location: getAttr('location', 'href'),
      size: parseInt(getAttr('size', 'package')) || 0,
      requires,
      provides,
      xml,
    });
  }
  return packages;
}

/* ===== Cache (IndexedDB — без ограничения размера) ===== */
const IDB_NAME = 'rpm-cache-db';
const IDB_STORE = 'packages';

function cacheKey(url) { return 'rpm:' + url; }

function openIDB() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onerror = () => reject(r.error);
    r.onsuccess = () => resolve(r.result);
    r.onupgradeneeded = (e) => {
      if (!e.target.result.objectStoreNames.contains(IDB_STORE)) {
        e.target.result.createObjectStore(IDB_STORE);
      }
    };
  });
}

async function getCachedData(url) {
  const key = cacheKey(url);
  try {
    const db = await openIDB();
    const data = await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    db.close();
    if (data) return data;
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    await setCachedData(url, parsed.packages);
    localStorage.removeItem(key);
    return parsed;
  } catch { return null; }
}

async function setCachedData(url, packages) {
  const key = cacheKey(url);
  const data = { ts: Date.now(), packages };
  try {
    const db = await openIDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      const req = tx.objectStore(IDB_STORE).put(data, key);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
    db.close();
  } catch (e) {
    toast(t('cacheWriteErr') + (e.message || t('unknown')), 'warn');
  }
}

function confirmClearCache() {
  document.getElementById('confirmText').textContent = t('clearCacheConfirm');
  _confirmAction = () => { clearAllCache(); };
  document.getElementById('confirmOverlay').classList.add('active');
}

async function clearAllCache() {
  try {
    const db = await openIDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  } catch (_) {}
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('rpm:')) keys.push(k);
  }
  keys.forEach(k => localStorage.removeItem(k));
  state.repos.forEach(r => { if (!r.loading) { r.packages = []; r.loaded = false; r.cached = false; } });
  mergeAllPackages();
  state.searchResults = [];
  document.getElementById('searchInput').value = '';
  renderResults();
  renderRepoList();
  await updateCacheStatusBar();
  toast(t('cacheCleared'), 'info');
}

async function getCacheSizeBytes() {
  let total = 0;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('rpm:')) total += (localStorage.getItem(k) || '').length * 2;
  }
  try {
    const db = await openIDB();
    const vals = await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    for (const val of vals) {
      if (val) total += new Blob([JSON.stringify(val)]).size;
    }
    db.close();
  } catch (_) {}
  return total;
}

function updateCacheSize() {
  getCacheSizeBytes().then(bytes => {
    document.getElementById('cacheSize').textContent = formatBytes(bytes);
  });
}

async function updateCacheStatusBar() {
  const bytes = await getCacheSizeBytes();
  document.getElementById('cacheStatus').textContent = bytes > 0 ? `${t('cache')} ${formatBytes(bytes)}` : '';
  document.getElementById('cacheSize').textContent = formatBytes(bytes);
}

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

/* ===== Merge & search ===== */
function mergeAllPackages() {
  state.allPackages = [];
  for (const repo of state.repos) {
    if (!repo.loaded) continue;
    for (const pkg of repo.packages) {
      state.allPackages.push({ ...pkg, repoUrl: pkg.repoUrl || repo.url, repoName: repo.name });
    }
  }
  buildSystemPreinstalledSet();
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const type = document.getElementById('searchType')?.value || 'name';
  if (!q) {
    state.searchResults = [...state.allPackages];
  } else {
    state.searchResults = state.allPackages.filter(p => {
      if (type === 'name') return (p.name || '').toLowerCase().includes(q);
      if (type === 'file') return (p.files || []).some(f => (f || '').toLowerCase().includes(q));
      if (type === 'requires') return (p.requires || []).some(r => (r.name || '').toLowerCase().includes(q));
      if (type === 'provides') return (p.provides || []).some(pr => (pr || '').toLowerCase().includes(q));
      return (p.name || '').toLowerCase().includes(q);
    });
    state.searchResults.sort((a, b) => {
      const aExact = a.name.toLowerCase() === q ? 0 : 1;
      const bExact = b.name.toLowerCase() === q ? 0 : 1;
      if (aExact !== bExact) return aExact - bExact;
      return a.name.localeCompare(b.name);
    });
  }
  renderResults();
}

/* ===== Render results ===== */
function renderResults() {
  const list = document.getElementById('resultsList');
  const header = document.getElementById('resultsHeader');
  const empty = document.getElementById('emptyState');
  const results = state.searchResults;

  if (!state.allPackages.length) {
    header.style.display = 'none';
    list.innerHTML = '';
    empty.style.display = '';
    return;
  }

  empty.style.display = 'none';
  header.style.display = '';
  document.getElementById('resultsCount').textContent = `${results.length} ${t('found')}`;

  if (!results.length) {
    list.innerHTML = '<div class="empty-state"><p>' + t('nothingFound') + '</p></div>';
    return;
  }

  list.innerHTML = results.slice(0, 200).map((p, i) => {
    const downloadUrl = p.repoUrl + p.location;
    const authPart = needsAuth(downloadUrl) && state.settings.username
      ? `${state.settings.username}:${state.settings.password}@`
      : '';
    const directUrl = downloadUrl.replace('://', '://' + authPart);

    return `<div class="pkg-card" onclick="showPkgCard(state.searchResults[${i}])">
      <div class="pkg-title">${esc(p.name)}</div>
      <div class="pkg-meta">${esc(p.ver)}-${esc(p.rel)} &middot; ${esc(p.arch)} &middot; ${formatBytes(p.size)}</div>
      ${p.summary ? `<div class="pkg-summary">${esc(p.summary)}</div>` : ''}
      <div class="pkg-repo">${esc(p.repoName)}</div>
      <div class="pkg-actions" onclick="event.stopPropagation()">
        <a href="${esc(directUrl)}" target="_blank"><button>${t('download')}</button></a>
        <button onclick="showDeps(${i})">${t('deps')}</button>
        <button onclick="showDeps(state.searchResults[${i}], true)">${t('depsRepo')}</button>
        <button onclick="showSystemDeps(state.searchResults[${i}])">${t('depsSystem')}</button>
      </div>
    </div>`;
  }).join('');

  if (results.length > 200) {
    list.innerHTML += `<div class="empty-state"><p>${t('shown200', { total: results.length })}</p></div>`;
  }
}

/* ===== Package card ===== */
let currentPkgCard = null;
let pkgCardHistory = [];

function showPkgCard(pkg, fromDep = false) {
  if (!pkg) return;
  if (fromDep && currentPkgCard) pkgCardHistory.push(currentPkgCard);
  currentPkgCard = pkg;
  const downloadUrl = pkg.repoUrl + pkg.location;
  const authPart = needsAuth(downloadUrl) && state.settings.username
    ? `${state.settings.username}:${state.settings.password}@`
    : '';
  const directUrl = downloadUrl.replace('://', '://' + authPart);

  document.getElementById('pkgCardTitle').textContent = pkg.name;
  document.getElementById('pkgCardDownload').href = directUrl;

  const verFull = (pkg.epoch && pkg.epoch !== '0') ? `${pkg.epoch}:${pkg.ver}-${pkg.rel}` : `${pkg.ver}-${pkg.rel}`;
  const allReq = [...(pkg.requires || [])].sort((a, b) => (a.name || '').localeCompare(b.name || ''));

  const body = document.getElementById('pkgCardBody');
  body.innerHTML = `
    <div class="pkg-card-detail">
      <div class="info-row"><span class="info-label">${t('version')}</span><span class="info-value">${esc(verFull)}</span></div>
      <div class="info-row"><span class="info-label">${t('arch')}</span><span class="info-value">${esc(pkg.arch)}</span></div>
      <div class="info-row"><span class="info-label">${t('size')}</span><span class="info-value">${formatBytes(pkg.size)}</span></div>
      <div class="info-row"><span class="info-label">${t('repo')}</span><span class="info-value">${esc(pkg.repoName)}</span></div>
      <div class="info-row"><span class="info-label">${t('path')}</span><span class="info-value">${esc(pkg.location)}</span></div>
      ${pkg.summary ? `<div class="info-row"><span class="info-label">${t('summary')}</span><span>${esc(pkg.summary)}</span></div>` : ''}
      ${pkg.description ? `<div class="section"><div class="section-title">${t('description')}</div><div class="description">${esc(pkg.description)}</div></div>` : ''}
      ${pkg.provides?.length ? `<div class="section"><div class="section-title">${t('provides')}</div><div class="provides-list">${pkg.provides.map(pr => `<span>${esc(pr)}</span>`).join('')}</div></div>` : ''}
      ${allReq.length ? `<div class="section"><div class="section-title">${t('requires')}</div><div class="requires-list" id="pkgCardRequires"></div></div>` : ''}
      ${(pkg.files || []).length ? `<div class="section"><div class="section-title">${t('files')} (${pkg.files.length})</div><div class="files-list">${pkg.files.map(f => esc(f)).join('\n')}</div></div>` : `<div class="section"><div class="section-title">${t('files')}</div><p class="files-unavail">${t('filesUnavail')}</p></div>`}
    </div>`;

  document.getElementById('pkgCardBack').style.display = pkgCardHistory.length ? '' : 'none';
  const hasDeps = (pkg.requires || []).length > 0;
  document.getElementById('pkgCardDepsDownload').style.display = hasDeps ? '' : 'none';
  document.getElementById('pkgCardDepsRepo').style.display = getDepsInSameRepo(pkg).length ? '' : 'none';
  document.getElementById('pkgCardDepsSystem').style.display = hasDeps ? '' : 'none';

  if (allReq.length) {
    const allProvides = new Set();
    for (const p of state.allPackages) {
      allProvides.add(p.name);
      for (const pr of p.provides) allProvides.add(pr);
    }
    const reqsEl = document.getElementById('pkgCardRequires');
    if (reqsEl) {
      allReq.forEach(d => {
        const found = allProvides.has(d.name);
        const verStr = d.ver ? ` ${d.flags} ${d.ver}` : '';
        const span = document.createElement('span');
        span.className = 'dep-name' + (found ? ' clickable' : '');
        span.textContent = d.name + verStr;
        if (found) {
          span.onclick = () => {
            const match = findPackageByDep(d.name);
            if (match) showPkgCard(match, true);
          };
        }
        reqsEl.appendChild(span);
      });
    }
  }

  document.getElementById('pkgCardOverlay').classList.add('active');
}

function closePkgCard() {
  currentPkgCard = null;
  pkgCardHistory = [];
  document.getElementById('pkgCardOverlay').classList.remove('active');
  closePkgXml();
}

function openDepsFromCard(filterBySameRepo = false) {
  const pkg = currentPkgCard;
  if (!pkg) return;
  closePkgCard();
  showDeps(pkg, filterBySameRepo);
}

function pkgCardBack() {
  if (!pkgCardHistory.length) return;
  const prev = pkgCardHistory.pop();
  showPkgCard(prev, false);
}

function showPkgXml() {
  if (!currentPkgCard) return;
  document.getElementById('pkgXmlTitle').textContent = `XML: ${currentPkgCard.name}`;
  const content = document.getElementById('pkgXmlContent');
  if (currentPkgCard.xml) {
    content.textContent = formatXml(currentPkgCard.xml);
  } else {
    content.textContent = t('xmlUnavail');
  }
  document.getElementById('pkgXmlOverlay').classList.add('active');
}

function closePkgXml() {
  document.getElementById('pkgXmlOverlay').classList.remove('active');
}

function formatXml(xml) {
  return xml.replace(/>\s*</g, '>\n<').trim();
}

function copyPkgXml() {
  if (!currentPkgCard?.xml) return;
  navigator.clipboard.writeText(currentPkgCard.xml).then(() => toast(t('copied'), 'success')).catch(() => toast(t('copyFailed'), 'error'));
}

function findPackageByDep(depName) {
  for (const p of state.allPackages) {
    if (p.name === depName) return p;
    if (p.provides && p.provides.includes(depName)) return p;
  }
  const base = depName.replace(/[.(].*$/, '');
  if (base !== depName) {
    for (const p of state.allPackages) {
      if (p.name === base) return p;
    }
  }
  return null;
}

function findPackageByDepInRepo(depName, repoName) {
  for (const p of state.allPackages) {
    if (p.repoName !== repoName) continue;
    if (p.name === depName) return p;
    if (p.provides && p.provides.includes(depName)) return p;
  }
  const base = depName.replace(/[.(].*$/, '');
  if (base !== depName) {
    for (const p of state.allPackages) {
      if (p.repoName !== repoName) continue;
      if (p.name === base) return p;
    }
  }
  return null;
}

function getDepsInSameRepo(pkg) {
  const allReq = pkg.requires || [];
  const seen = new Set();
  const result = [];
  for (const d of allReq) {
    const match = findPackageByDepInRepo(d.name, pkg.repoName);
    if (match && !seen.has(match.name)) {
      seen.add(match.name);
      result.push(match);
    }
  }
  return result;
}

/* ===== System dependency tree ===== */
function getSystemBaseDeps() {
  const raw = (state.settings.systemBaseDeps ?? DEFAULT_SYSTEM_BASE_DEPS).trim();
  const adaptation = document.getElementById('inpAdaptation')?.value?.trim() || '';
  return raw.split(/\r?\n/).map(line => line.trim().replace(/\$adaptation/g, adaptation)).filter(Boolean);
}

function buildSystemPreinstalledSet() {
  state.systemPreinstalled.clear();
  const baseNames = getSystemBaseDeps();
  const queue = [...baseNames];
  const seen = new Set();
  while (queue.length) {
    const name = queue.shift();
    if (seen.has(name)) continue;
    const pkg = findPackageByDep(name);
    if (!pkg) continue;
    seen.add(pkg.name);
    state.systemPreinstalled.add(pkg.name);
    for (const prov of pkg.provides || []) state.systemPreinstalled.add(prov);
    const nonStd = (pkg.requires || []).filter(r => !SYSTEM_DEP_PATTERNS.some(pat => pat.test(r.name)));
    for (const d of nonStd) {
      const match = findPackageByDep(d.name);
      if (match && !seen.has(match.name)) queue.push(match.name);
    }
  }
  state.systemPreinstalledCount = seen.size;
}

function refreshSystemDeps() {
  buildSystemPreinstalledSet();
  toast(t('systemRefreshed', { count: state.systemPreinstalledCount ?? 0 }), 'success');
}

function getSystemTreePackages() {
  return state.allPackages.filter(p => state.systemPreinstalled.has(p.name));
}

function showSystemTree() {
  const packages = getSystemTreePackages().sort((a, b) => a.name.localeCompare(b.name));
  document.getElementById('systemTreeTitle').textContent = t('systemTreeTitle', { count: packages.length });
  const content = document.getElementById('systemTreeContent');
  if (!packages.length) {
    content.innerHTML = '<p style="color:var(--text-muted)">' + t('systemTreeEmpty') + '</p>';
  } else {
    content.innerHTML = `<p style="margin-bottom:10px;color:var(--text-muted);font-size:.85rem">${packages.length} ${t('packages')}:</p>
    <ul class="deps-list" id="systemTreeListContainer">${packages.map((p, i) => {
      const url = p.repoUrl + p.location;
      const authPart = needsAuth(url) && state.settings.username ? `${state.settings.username}:${state.settings.password}@` : '';
      const directUrl = url.replace('://', '://' + authPart);
      return `<li><span class="dep-name clickable" data-pkg-idx="${i}">${esc(p.name)} ${esc(p.ver)}-${esc(p.rel)}</span><span class="dep-right"><span class="dep-repo">${esc(p.repoName || '')}</span><a href="${esc(directUrl)}" target="_blank"><button class="dep-dl-btn">${t('download')}</button></a></span></li>`;
    }).join('')}</ul>`;
    const list = content.querySelector('#systemTreeListContainer');
    state._systemTreePackages = packages;
    list?.addEventListener('click', (e) => {
      if (e.target.closest('a, button')) return;
      const span = e.target.closest('.dep-name.clickable');
      if (!span) return;
      const idx = parseInt(span.dataset?.pkgIdx, 10);
      if (!isNaN(idx) && state._systemTreePackages?.[idx]) {
        closeSystemTree();
        showPkgCard(state._systemTreePackages[idx], false);
      }
    });
  }
  document.getElementById('systemTreeOverlay').classList.add('active');
}

function closeSystemTree() {
  document.getElementById('systemTreeOverlay').classList.remove('active');
  state._systemTreePackages = null;
}

function downloadSystemTreeList() {
  const packages = getSystemTreePackages().sort((a, b) => a.name.localeCompare(b.name));
  const text = `# System tree packages\n# Base: ${getSystemBaseDeps().join(', ')}\n\n` + packages.map(p => `${p.name} ${p.ver}-${p.rel} ${p.arch}`).join('\n');
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'system-tree.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

function isPreinstalled(depName) {
  if (state.systemPreinstalled.has(depName)) return true;
  const base = depName.replace(/[.(].*$/, '');
  return base !== depName && state.systemPreinstalled.has(base);
}

function getSystemDepsRecursive(pkg) {
  const result = [];
  const visited = new Set();
  const queue = [{ pkg, depth: 0 }];
  while (queue.length) {
    const { pkg: curr, depth } = queue.shift();
    if (visited.has(curr.name)) continue;
    visited.add(curr.name);
    const nonStd = (curr.requires || []).filter(r => !SYSTEM_DEP_PATTERNS.some(pat => pat.test(r.name)));
    for (const d of nonStd) {
      if (isPreinstalled(d.name)) continue;
      const match = findPackageByDep(d.name);
      result.push({ dep: d, match, depth });
      if (match && !visited.has(match.name)) queue.push({ pkg: match, depth: depth + 1 });
    }
  }
  return result;
}

function showSystemDeps(resultIndexOrPkg) {
  const pkg = typeof resultIndexOrPkg === 'number' ? state.searchResults[resultIndexOrPkg] : resultIndexOrPkg;
  if (!pkg) return;
  state.currentDepsPkg = pkg;
  const items = getSystemDepsRecursive(pkg);
  const uniqueByPkg = new Map();
  for (const { dep, match, depth } of items) {
    const key = match ? match.name : dep.name;
    if (!uniqueByPkg.has(key) || uniqueByPkg.get(key).depth > depth) {
      uniqueByPkg.set(key, { dep, match, depth });
    }
  }
  const sorted = [...uniqueByPkg.values()].sort((a, b) => a.depth - b.depth || (a.dep.name || '').localeCompare(b.dep.name || ''));
  document.getElementById('systemDepsTitle').textContent = t('depsSystemTitle', { name: pkg.name });
  const content = document.getElementById('systemDepsContent');
  if (!sorted.length) {
    content.innerHTML = '<p style="color:var(--text-muted)">' + t('noSystemDeps') + '</p>';
  } else {
    content.innerHTML = `<p style="margin-bottom:10px;color:var(--text-muted);font-size:.85rem">${sorted.length} ${t('depsSystemCount')}:</p>
    <ul class="deps-list" id="systemDepsListContainer">${sorted.map(({ dep, match, depth }) => {
      const verStr = dep.ver ? ` ${dep.flags} ${dep.ver}` : '';
      const indent = '&nbsp;'.repeat(depth * 4);
      let rightPart = '';
      if (match) {
        const url = match.repoUrl + match.location;
        const authPart = needsAuth(url) && state.settings.username ? `${state.settings.username}:${state.settings.password}@` : '';
        const directUrl = url.replace('://', '://' + authPart);
        rightPart = `<span class="dep-repo">${esc(match.repoName || '')}</span><a href="${esc(directUrl)}" target="_blank"><button class="dep-dl-btn">${t('download')}</button></a>`;
      } else {
        rightPart = '<span class="dep-avail missing">' + t('notFound') + '</span>';
      }
      const dataAttr = match ? ` data-dep-name="${encodeURIComponent(dep.name)}"` : '';
      const clickable = match ? ' clickable' : '';
      return `<li><span class="dep-name${clickable}"${dataAttr}>${indent}${esc(dep.name)}${esc(verStr)}</span><span class="dep-right">${rightPart}</span></li>`;
    }).join('')}</ul>`;
    content.querySelector('#systemDepsListContainer')?.addEventListener('click', (e) => {
      const span = e.target.closest('.dep-name.clickable');
      if (span?.dataset.depName) {
        const match = findPackageByDep(decodeURIComponent(span.dataset.depName));
        if (match) { closeSystemDeps(); showPkgCard(match, true); }
      }
    });
  }
  document.getElementById('systemDepsOverlay').classList.add('active');
}

function closeSystemDeps() {
  document.getElementById('systemDepsOverlay').classList.remove('active');
}

function openSystemDepsFromCard() {
  const pkg = currentPkgCard;
  if (!pkg) return;
  closePkgCard();
  showSystemDeps(pkg);
}

function downloadSystemDepsList() {
  const pkg = state.currentDepsPkg;
  if (!pkg) return;
  const items = getSystemDepsRecursive(pkg);
  const uniqueByPkg = new Map();
  for (const { dep, match } of items) {
    const key = match ? match.name : dep.name;
    if (!uniqueByPkg.has(key)) uniqueByPkg.set(key, dep);
  }
  const text = `# System dependencies for ${pkg.name} ${pkg.ver}-${pkg.rel}\n# Not pre-installed:\n\n` +
    [...uniqueByPkg.values()].map(d => d.name + (d.ver ? ` ${d.flags} ${d.ver}` : '')).join('\n');
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${pkg.name}-system-deps.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function downloadDepsFromSameRepo(pkgArg) {
  const pkg = pkgArg || currentPkgCard;
  if (!pkg) return;
  const deps = getDepsInSameRepo(pkg);
  if (!deps.length) {
    toast(t('noDepsRepo'), 'info');
    return;
  }
  const authPart = needsAuth(pkg.repoUrl) && state.settings.username
    ? `${state.settings.username}:${state.settings.password}@`
    : '';
  const urls = deps.map(d => (d.repoUrl || pkg.repoUrl).replace('://', '://' + authPart) + d.location);
  const text = urls.join('\n');
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${pkg.name}-deps-urls.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(t('wgetHint', { count: deps.length }), 'success');
}

/* ===== Dependencies ===== */
let downloadedDepsKeys = new Set();

function markDepDownloaded(el) {
  const key = el.dataset.dlIdx;
  if (key != null) downloadedDepsKeys.add(key);
  const btn = el.querySelector('button');
  if (btn) { btn.textContent = t('downloaded'); btn.classList.add('downloaded'); }
}

function showDeps(resultIndexOrPkg, filterBySameRepo = false) {
  downloadedDepsKeys.clear();
  const pkg = typeof resultIndexOrPkg === 'number' ? state.searchResults[resultIndexOrPkg] : resultIndexOrPkg;
  if (!pkg) return;
  state.currentDepsPkg = pkg;

  let nonStd = (pkg.requires || []).filter(r => !SYSTEM_DEP_PATTERNS.some(pat => pat.test(r.name)));
  if (filterBySameRepo) {
    nonStd = nonStd.filter(d => findPackageByDepInRepo(d.name, pkg.repoName));
  }

  const allProvides = new Set();
  for (const p of state.allPackages) {
    allProvides.add(p.name);
    for (const prov of p.provides) allProvides.add(prov);
  }

  const findMatch = (depName) => filterBySameRepo ? findPackageByDepInRepo(depName, pkg.repoName) : findPackageByDep(depName);

  document.getElementById('depsTitle').textContent = filterBySameRepo ? t('depsRepoTitle', { name: pkg.name }) : t('depsTitle', { name: pkg.name });
  const content = document.getElementById('depsContent');

  if (!nonStd.length) {
    content.innerHTML = '<p style="color:var(--text-muted)">' + (filterBySameRepo ? t('noDepsRepo') : t('noNonStdDeps')) + '</p>';
  } else {
    content.innerHTML = `<p style="margin-bottom:10px;color:var(--text-muted);font-size:.85rem">${nonStd.length} ${t('depsCount')}:</p>
    <ul class="deps-list" id="depsListContainer">${nonStd.map((d, idx) => {
      const match = findMatch(d.name);
      const found = !!match;
      const verStr = d.ver ? ` ${d.flags} ${d.ver}` : '';
      const dataAttr = found ? ` data-dep-name="${encodeURIComponent(d.name)}"` : '';
      let rightPart = '';
      if (found) {
        const url = match.repoUrl + match.location;
        const authPart = needsAuth(url) && state.settings.username ? `${state.settings.username}:${state.settings.password}@` : '';
        const directUrl = url.replace('://', '://' + authPart);
        const repoHtml = `<span class="dep-repo" title="${esc(match.repoName || '')}">${esc(match.repoName || '')}</span>`;
        rightPart = `${repoHtml}<a href="${esc(directUrl)}" target="_blank" class="dep-dl-link" data-dl-idx="${idx}"><button class="dep-dl-btn">${t('download')}</button></a>`;
      } else {
        rightPart = '<span class="dep-avail missing">' + t('notFound') + '</span>';
      }
      return `<li>
        <span class="dep-name ${found ? 'clickable' : ''}"${dataAttr}>${esc(d.name)}${esc(verStr)}</span>
        <span class="dep-right">${rightPart}</span>
      </li>`;
    }).join('')}</ul>`;
    content.querySelector('#depsListContainer').addEventListener('click', (e) => {
      const dlLink = e.target.closest('a.dep-dl-link');
      if (dlLink) { markDepDownloaded(dlLink); return; }
      const span = e.target.closest('.dep-name.clickable');
      if (span && span.dataset.depName) {
        const match = findMatch(decodeURIComponent(span.dataset.depName));
        if (match) { closeDeps(); showPkgCard(match, true); }
      }
    });
  }

  document.getElementById('depsOverlay').classList.add('active');
}

function closeDeps() {
  document.getElementById('depsOverlay').classList.remove('active');
}

function downloadDepsList() {
  const pkg = state.currentDepsPkg;
  if (!pkg) return;
  const nonStd = (pkg.requires || []).filter(r => !SYSTEM_DEP_PATTERNS.some(pat => pat.test(r.name)));
  const text = `# Dependencies for ${pkg.name} ${pkg.ver}-${pkg.rel}\n# Non-standard requires:\n\n` +
    nonStd.map(d => d.name + (d.ver ? ` ${d.flags} ${d.ver}` : '')).join('\n');
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${pkg.name}-deps.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ===== Settings modal ===== */
function addRepoTemplateRow(item) {
  const tbody = document.getElementById('cfgRepoTemplatesList');
  const row = document.createElement('tr');
  row.className = 'template-row' + (item && !item.enabled ? ' template-disabled' : '');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = !item || item.enabled !== false;
  cb.title = t('enableRepo');
  cb.onchange = () => { row.classList.toggle('template-disabled', !cb.checked); };
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.placeholder = '$releaseDomain/releases/$release/.../$arch/';
  inp.value = (item && item.template) || (typeof item === 'string' ? item : '');
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = t('remove');
  btn.onclick = () => row.remove();
  row.appendChild(document.createElement('td')).appendChild(cb);
  row.appendChild(document.createElement('td')).appendChild(inp);
  row.appendChild(document.createElement('td')).appendChild(btn);
  tbody.appendChild(row);
}

function addCorsProxyRow(item) {
  const tbody = document.getElementById('cfgCorsProxiesList');
  const row = document.createElement('tr');
  row.className = 'template-row proxy-row';
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.placeholder = 'https://example.com/?url=$url';
  inp.value = (item && item.template) || (typeof item === 'string' ? item : '');
  const sel = document.createElement('select');
  ['header', 'query', 'corsfix', 'corsHeaders'].forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = t('corsAuth' + v.charAt(0).toUpperCase() + v.slice(1));
    sel.appendChild(opt);
  });
  const at = item && item.authType;
  sel.value = (at === 'query' || at === 'corsfix' || at === 'corsHeaders') ? at : 'header';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = t('remove');
  btn.onclick = () => row.remove();
  row.appendChild(document.createElement('td')).appendChild(inp);
  row.appendChild(document.createElement('td')).appendChild(sel);
  row.appendChild(document.createElement('td')).appendChild(btn);
  tbody.appendChild(row);
}

function updateTemplateHelpContent() {
  const releaseDomain = document.getElementById('cfgReleaseDomain').value || t('empty');
  const secureDomain = document.getElementById('cfgSecureDomain').value || t('empty');
  const release = document.getElementById('inpRelease').value.trim() || t('notSelected');
  const arch = document.getElementById('selArch').value;
  const adaptation = document.getElementById('inpAdaptation').value.trim() || t('notSelected');
  const el = document.getElementById('templateHelpContent');
  if (el) el.innerHTML = `<code>$releaseDomain</code> = ${esc(releaseDomain)}<br>
<code>$secureDomain</code> = ${esc(secureDomain)}<br>
<code>$release</code> = ${esc(release)}<br>
<code>$arch</code> = ${esc(arch)}<br>
<code>$adaptation</code> = ${esc(adaptation)}`;
}

function showSettings() {
  const s = state.settings;
  document.getElementById('cfgReleaseDomain').value = s.releaseDomain;
  document.getElementById('cfgSecureDomain').value = s.secureDomain;
  document.getElementById('cfgUsername').value = s.username;
  document.getElementById('cfgPassword').value = s.password;
  document.getElementById('cfgSystemBaseDeps').value = s.systemBaseDeps ?? DEFAULT_SYSTEM_BASE_DEPS;
  const list = document.getElementById('cfgRepoTemplatesList');
  list.innerHTML = '';
  normalizeRepoTemplates(s.repoTemplates).forEach(item => addRepoTemplateRow(item));
  const proxyList = document.getElementById('cfgCorsProxiesList');
  proxyList.innerHTML = '';
  (s.corsProxies || []).forEach(item => addCorsProxyRow(item));
  if (!proxyList.querySelector('tr')) addCorsProxyRow();
  updateTemplateHelpContent();
  ['cfgReleaseDomain', 'cfgSecureDomain'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateTemplateHelpContent);
  });
  updateCacheSize();
  document.getElementById('settingsOverlay').classList.add('active');
}

function closeSettings() {
  ['cfgReleaseDomain', 'cfgSecureDomain'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.removeEventListener('input', updateTemplateHelpContent);
  });
  document.getElementById('settingsOverlay').classList.remove('active');
}

function saveSettings() {
  const s = state.settings;
  s.releaseDomain = document.getElementById('cfgReleaseDomain').value.replace(/\/+$/, '');
  s.secureDomain = document.getElementById('cfgSecureDomain').value.replace(/\/+$/, '');
  s.username = document.getElementById('cfgUsername').value;
  s.password = document.getElementById('cfgPassword').value;
  s.repoTemplates = Array.from(document.querySelectorAll('#cfgRepoTemplatesList .template-row')).map(row => {
    const inp = row.querySelector('td:nth-child(2) input');
    const cb = row.querySelector('input[type="checkbox"]');
    const t = inp?.value.trim();
    return t ? { template: t, enabled: cb?.checked !== false } : null;
  }).filter(Boolean);
  s.corsProxies = Array.from(document.querySelectorAll('#cfgCorsProxiesList .proxy-row')).map(row => {
    const inp = row.querySelector('td:nth-child(1) input');
    const sel = row.querySelector('td:nth-child(2) select');
    const t = inp?.value.trim();
    if (!t) return null;
    const at = sel?.value;
    return {
      template: t,
      authType: (at === 'query' || at === 'corsfix' || at === 'corsHeaders') ? at : 'header',
    };
  }).filter(Boolean);
  s.systemBaseDeps = (document.getElementById('cfgSystemBaseDeps')?.value ?? '').trim() || DEFAULT_SYSTEM_BASE_DEPS;
  if (!s.corsProxies.length) s.corsProxies = DEFAULT_CORS_PROXIES.map(p => ({ ...p }));
  persistSettings();
  closeSettings();
  updateRepoList();
  toast(t('settingsSaved'), 'success');
  if (s.username) document.getElementById('authBanner').style.display = 'none';
}

/* ===== Helpers ===== */
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ===== URL params ===== */
function applyUrlParams() {
  const params = new URLSearchParams(location.search);
  const release = params.get('release');
  const arch = params.get('arch');
  const adaptation = params.get('adaptation');
  const query = params.get('query');
  if (release) document.getElementById('inpRelease').value = release.trim().toLowerCase() === 'latest' ? 'latest' : release;
  if (arch) {
    const sel = document.getElementById('selArch');
    if ([...sel.options].some(o => o.value === arch)) sel.value = arch;
  }
  if (adaptation) document.getElementById('inpAdaptation').value = adaptation;
  if (query) document.getElementById('searchInput').value = query;
  return { release, arch, adaptation, query };
}

/* ===== Last config persistence ===== */
const CONFIG_KEYS = { release: 'rpm_last_release', arch: 'rpm_last_arch', adaptation: 'rpm_last_adaptation' };

function saveLastConfig() {
  const release = document.getElementById('inpRelease').value.trim();
  const arch = document.getElementById('selArch').value;
  const adaptation = document.getElementById('inpAdaptation').value.trim();
  if (release) localStorage.setItem(CONFIG_KEYS.release, release);
  localStorage.setItem(CONFIG_KEYS.arch, arch);
  if (adaptation) localStorage.setItem(CONFIG_KEYS.adaptation, adaptation);
}

function restoreLastConfig() {
  const release = localStorage.getItem(CONFIG_KEYS.release);
  const arch = localStorage.getItem(CONFIG_KEYS.arch);
  const adaptation = localStorage.getItem(CONFIG_KEYS.adaptation);
  const selArch = document.getElementById('selArch');
  if (release) document.getElementById('inpRelease').value = release;
  if (arch && [...selArch.options].some(o => o.value === arch)) selArch.value = arch;
  if (adaptation) document.getElementById('inpAdaptation').value = adaptation;
}

/* ===== Event wiring ===== */
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(window._searchTimer);
  window._searchTimer = setTimeout(doSearch, 300);
});
document.getElementById('searchType').addEventListener('change', doSearch);
document.getElementById('inpRelease').addEventListener('change', () => { saveLastConfig(); updateRepoList(); });
document.getElementById('inpRelease').addEventListener('input', () => {
  clearTimeout(window._releaseTimer);
  window._releaseTimer = setTimeout(() => { saveLastConfig(); updateRepoList(); }, 400);
});
document.getElementById('selArch').addEventListener('change', () => { saveLastConfig(); updateRepoList(); });
document.getElementById('inpAdaptation').addEventListener('change', () => {
  const val = document.getElementById('inpAdaptation').value.trim();
  if (val && !getAdaptations().includes(val)) {
    saveAdaptation(val);
    toast(t('adaptAdded'), 'success');
  }
  saveLastConfig();
  updateRepoList();
});
document.getElementById('inpAdaptation').addEventListener('input', () => {
  clearTimeout(window._adaptTimer);
  window._adaptTimer = setTimeout(() => { saveLastConfig(); updateRepoList(); }, 400);
});
document.getElementById('inpAdaptation').addEventListener('blur', () => {
  const val = document.getElementById('inpAdaptation').value.trim();
  if (val && !getAdaptations().includes(val)) {
    saveAdaptation(val);
    toast(t('adaptAdded'), 'success');
  }
  saveLastConfig();
});

/* ===== Init ===== */
(async function init() {
  applyTranslations();
  restoreLastConfig();
  const urlParams = applyUrlParams();
  if (getCorsProxies().length > 0) {
    await loadReleases();
  }
  await updateRepoList();
  if (urlParams.query) {
    document.getElementById('searchInput').value = urlParams.query;
    doSearch();
  }
})();
</script>
